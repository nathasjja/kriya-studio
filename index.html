<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRIYĀ Studio</title>
<meta name="theme-color" content="#12130E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KRIYĀ Studio">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<meta name="robots" content="noindex, nofollow">
<script src="config.js"></script>
<script src="kriya.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#12130E;--chrome:#0B0C08;--lime:#DCFF3E;--moss:#2F3B12;--moss-deep:#1A2108;--paper:#F3F0E8;--calm-mut:#C9CDB7;--nav:76px;
--bg:#12130E;--surface:#1C1D17;--surface2:#26281F;--sunk:#16170F;--line:#2E3026;--line2:#3A3C31;--text:#F3F0E8;--muted:#A6A79A;--faint:#8C8E80;
--hi:#DCFF3E;--btn-bg:#DCFF3E;--btn-fg:#12130E;--on-bg:#DCFF3E;--on-fg:#12130E;--chip-bg:#F3F0E8;--chip-fg:#12130E;--strong-bg:#F3F0E8;--strong-fg:#12130E;
--check-bg:#DCFF3E;--check-fg:#12130E;--check-off:#6B6D61;--track:#2E3026;--fill:#DCFF3E;--scrim:rgba(0,0,0,.6)}
html[data-theme=light]{--bg:#F3F0E8;--surface:#FAF8F2;--surface2:#E7E3D6;--sunk:#ECE8DC;--line:rgba(18,19,14,.14);--line2:rgba(18,19,14,.26);--text:#12130E;--muted:#55574C;--faint:#6E7064;
--hi:#2F3B12;--btn-bg:#12130E;--btn-fg:#DCFF3E;--on-bg:#12130E;--on-fg:#DCFF3E;--chip-bg:#12130E;--chip-fg:#F3F0E8;--strong-bg:#12130E;--strong-fg:#F3F0E8;
--check-bg:#12130E;--check-fg:#DCFF3E;--check-off:#8A8C80;--track:rgba(18,19,14,.14);--fill:#12130E;--scrim:rgba(18,19,14,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;line-height:1.4;transition:background .2s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--hi)}
.mono{font-family:'DM Mono',ui-monospace,monospace}
.label{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.02em;text-transform:lowercase;color:var(--muted)}
.muted{color:var(--muted)}
.hi{color:var(--hi)}
.center{text-align:center}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
/* header + nav: ink in both themes, lime lives there */
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);border-bottom:1px solid #2A2C22}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:8px}
.wordbtn{background:none;border:0;padding:0;min-height:44px;color:inherit}
.word{font-weight:800;font-stretch:75%;font-size:26px;letter-spacing:-.01em;line-height:1;color:var(--lime);display:flex;align-items:baseline;gap:10px}
.word small{font-family:'DM Mono',monospace;font-weight:400;font-stretch:100%;font-size:12px;letter-spacing:.02em;color:#B9BAAD}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.top .iconbtn{border-color:rgba(243,240,232,.18);color:var(--paper)}
.me{display:flex;gap:6px;align-items:center}
.me .who{height:44px;padding:0 12px;border-radius:10px;border:1px solid rgba(243,240,232,.18);background:transparent;font:400 13px 'DM Mono',monospace;color:#B9BAAD;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:18px 0 calc(var(--nav) + 100px)}
h1,.pagetitle{font-size:46px;font-weight:800;font-stretch:75%;text-transform:uppercase;line-height:.9;margin:4px 0 16px;letter-spacing:-.005em}
.hello{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.hello h1{margin:0}
h2{font-size:30px;font-weight:800;font-stretch:75%;text-transform:uppercase;line-height:.92;margin:8px 0 14px;letter-spacing:-.005em}
h3{font-size:22px;font-weight:800;font-stretch:75%;text-transform:uppercase;line-height:.95;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.sechead h3{margin:0}
.linkbtn{background:none;border:0;color:var(--hi);font:400 13px 'DM Mono',monospace;min-height:44px;padding:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--chrome);border-top:1px solid #2A2C22;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav);padding:0 6px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#A6A79A;font:400 11px 'DM Mono',monospace;text-transform:lowercase;position:relative}
nav.tabs button[aria-current=page]{color:var(--lime)}
.badge{position:absolute;top:12px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--lime);color:var(--ink);font:500 11px/18px 'DM Mono',monospace}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:6;height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--ink);background:var(--lime);color:var(--ink);font-weight:800;font-stretch:75%;font-size:22px;text-transform:uppercase;display:flex;gap:8px;align-items:center;box-shadow:4px 4px 0 var(--chrome)}
/* segmented controls */
.segbar{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin:0 0 14px}
.segbar button{height:44px;border-radius:9px;border:0;background:transparent;color:var(--muted);font:400 13px 'DM Mono',monospace;text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.segbar button[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.seg button{height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line2);background:transparent;font:400 13px 'DM Mono',monospace;text-transform:lowercase;color:var(--text)}
.seg button[aria-pressed=true]{background:var(--chip-bg);color:var(--chip-fg);border-color:var(--chip-bg)}
/* calm (moss) panels: same in both themes */
.calm{background:var(--moss);color:var(--paper);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;margin:0 0 6px}
.calm .row{align-items:baseline}
.calm-hi{color:var(--lime)!important}
.calm-mut{color:var(--calm-mut)!important}
.bignum{font:500 36px/1 'DM Mono',monospace}
.bignum .calm-mut{font-size:15px}
.calm-bar{background:var(--moss-deep)!important;margin-top:0}
.calm-bar i{background:var(--lime)!important}
.calm-input{background:var(--moss-deep);border-color:#4A5A1F;color:var(--paper);margin-top:6px}
.mycomm{margin-bottom:14px}
/* checklist */
.check{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:10px 14px;margin:0 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-align:left}
.check .box{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:2px solid var(--check-off);display:flex;align-items:center;justify-content:center;color:var(--check-fg);transition:transform .12s}
.check .ct{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.check .ci{font-size:16px;line-height:1.25}
.check .cm{font:400 12px 'DM Mono',monospace;color:var(--muted)}
.check.on{background:var(--sunk)}
.check.on .box{background:var(--check-bg);border-color:var(--check-bg);transform:scale(1.04)}
.check.on .ci{color:var(--faint);text-decoration:line-through}
.check:active .box{transform:scale(.9)}
/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 56px;height:74px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text)}
.day .d{font-weight:800;font-stretch:75%;font-size:26px;line-height:1}
.day .w{font:400 11px 'DM Mono',monospace;text-transform:lowercase;color:var(--muted)}
.day .dots{height:6px;display:flex;gap:3px}
.day .dots i{width:5px;height:5px;border-radius:3px;background:var(--hi)}
.day[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}
.day[aria-pressed=true] .w{color:inherit;opacity:.75}
.day[aria-pressed=true] .dots i{background:var(--on-fg)}
/* cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--text);text-decoration:none}
.card:active{background:var(--surface2)}
.calmcard{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.calmcard .sub,.calmcard .openlist{color:var(--lime)}
.calmcard .bar{background:var(--moss-deep)}
.calmcard .bar i{background:var(--lime)}
.calmcard .count{color:var(--lime)}
.rowcard{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.rowcard>span:first-child{display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.time{font:500 15px 'DM Mono',monospace;min-width:52px;padding-top:2px;color:var(--hi)}
.title{font-weight:700;font-size:18px;line-height:1.2}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.avatar{width:36px;height:36px;border-radius:18px;background:var(--surface2);color:var(--text);font:400 12px 'DM Mono',monospace;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.calmcard .avatar{background:var(--moss-deep);color:var(--paper)}
.avatar.sm{width:26px;height:26px;font-size:11px}
.count{font:500 20px 'DM Mono',monospace}
.openlist{margin:8px 0 4px;font-size:14px;line-height:1.4}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pill{font:400 12px 'DM Mono',monospace;text-transform:lowercase;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--moss);border-color:var(--moss);color:var(--lime)}
.pill.warn{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pill.off{text-decoration:line-through}
.pill.idchip{background:var(--surface2);border-color:var(--surface2);color:var(--text)}
.pill.plain{border:0;padding:3px 0}
.pill.prio-urgent{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pill.prio-high{color:var(--text);border-color:var(--check-off)}
.pill.due-over{background:var(--strong-bg);border-color:var(--strong-bg);color:var(--strong-fg)}
.pill.due-soon{border-color:var(--hi);color:var(--hi)}
.pill.due-week{color:var(--text)}
.task .tt{display:block;margin:0 0 8px}
.task.isdone .tt{color:var(--faint);text-decoration:line-through}
.blockline{display:block;background:var(--moss);color:var(--paper);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.35;margin:0 0 8px}
.ownerline{display:flex;align-items:center;gap:8px;font-size:14px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin:0 0 0 4px}
.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:28px 16px;text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:14px;text-transform:lowercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--surface2);border-radius:12px;padding:14px}
.stat.hot{background:var(--lime);color:var(--ink)}
.stat.hot .muted{color:#3A3C31}
.stat .n{font:500 21px 'DM Mono',monospace;margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--fill);border-radius:4px;transition:width .3s}
.stat.hot .bar{background:rgba(18,19,14,.15)}
.stat.hot .bar i{background:var(--ink)}
.callout{background:var(--moss);color:var(--paper);border-radius:12px;padding:12px 14px;margin:12px 0}
.callout .label{color:var(--lime)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
th{font:400 12px 'DM Mono',monospace;text-transform:lowercase;color:var(--muted)}
td.r,th.r{text-align:right;font-family:'DM Mono',monospace;padding-left:14px;white-space:nowrap}
tr.me-row td{color:var(--hi);font-weight:600}
.whisper{font:400 13px 'DM Mono',monospace;text-transform:lowercase;color:var(--muted);margin:10px 0}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:94vh;overflow:auto;background:var(--bg);color:var(--text);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;padding:0 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;border-bottom:2px solid var(--text);margin-bottom:14px;z-index:2}
.sheet .head h2{margin:0;font-size:30px}
.tasktitle{font-size:34px;margin:0 0 16px}
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.statusgrid button{height:46px;border-radius:12px;border:1px solid var(--line2);background:transparent;font:400 14px 'DM Mono',monospace;color:var(--text)}
.statusgrid button .spin{width:12px;height:12px;margin-right:8px;vertical-align:-1px}
.saving-note{margin:6px 0 0}
.statusgrid button[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.facts dt{font:400 12px 'DM Mono',monospace;color:var(--muted)}
.facts dd{margin:4px 0 0}
.desc{margin:6px 0 10px;line-height:1.45;white-space:pre-wrap}
.upd{display:flex;flex-direction:column;gap:3px;padding:0 0 10px;margin:0 0 10px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.inrow{display:flex;gap:8px;margin-top:6px}
.inrow .input{flex:1 1 auto;min-width:0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;font-size:15px;margin:8px 0}
.kv dt{font:400 12px 'DM Mono',monospace;text-transform:lowercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;text-decoration:none;color:var(--text);padding:0 14px}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);font-weight:800;font-stretch:75%;font-size:21px;text-transform:uppercase;min-height:54px}
.btn.wide{grid-column:1/-1;width:100%;margin-top:6px}
.btn:disabled{opacity:.5}
.note{background:var(--moss);color:var(--paper);border-radius:12px;padding:14px;margin:8px 0 14px;white-space:pre-wrap}
.note .label{color:var(--lime);display:block;margin-bottom:6px}
/* forms */
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--text);padding:12px 14px;font-size:16px;outline:none}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.input::placeholder{color:var(--faint)}
html[data-theme=dark] input[type=date]{color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:12px;background:var(--surface);height:48px}
.stepper button{width:48px;height:46px;border:0;background:none;font-size:22px;color:var(--text)}
.stepper span{flex:1;text-align:center;font:500 16px 'DM Mono',monospace}
.suggest{border:1px solid var(--line2);border-radius:12px;margin-top:6px;overflow:hidden}
.suggest button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);min-height:46px;color:var(--text)}
.suggest button:last-child{border-bottom:0}
.chosen{display:flex;justify-content:space-between;align-items:center;background:var(--moss);color:var(--paper);border-radius:12px;padding:10px 10px 10px 14px}
.chosen .sub{color:var(--calm-mut)}
.chosen .iconbtn{border-color:rgba(243,240,232,.3);color:var(--paper)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.thumbs a,.thumbs div{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.thumbs img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 90px);z-index:40;background:var(--ink);color:var(--lime);padding:12px 18px;border-radius:12px;font:400 14px 'DM Mono',monospace;text-transform:lowercase;max-width:90vw;border:1px solid #2E3026;animation:up .18s ease-out}
.toast.err{background:var(--lime);color:var(--ink);border:2px solid var(--ink)}
/* lock */
.lockbg{background:var(--lime);min-height:100vh;color:var(--ink)}
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;max-width:420px;margin:0 auto}
.lock .word{color:var(--ink);font-size:30px}
.lock .word small{color:var(--ink)}
.lock h1{font-size:clamp(52px,16vw,64px);margin:28px 0 10px;letter-spacing:-.01em;color:var(--ink)}
.lock .whisper{font:400 14px 'DM Mono',monospace;text-transform:lowercase;margin:0 0 28px;color:var(--ink)}
.lock .label{color:var(--ink)}
.lock .input{background:var(--paper);border:2px solid var(--ink);color:var(--ink)}
.lock .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.who-list{display:flex;flex-direction:column;gap:8px}
.who-btn{justify-content:space-between;background:var(--paper);border:2px solid var(--ink);color:var(--ink);min-height:58px;font-size:18px}
.who-btn .mono{font-size:12px;font-weight:400}
.codebox{font:500 28px 'DM Mono',monospace;letter-spacing:.4em;text-align:center}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.range{width:100%;height:32px;accent-color:var(--hi)}
html[data-theme=dark] .range{accent-color:#DCFF3E}
.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.detailgrid button{min-height:56px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 12px;text-align:left;font-weight:600;font-size:15px}
.detailgrid button .mono{font-weight:400;font-size:11px;opacity:.8}
.detailgrid button[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}
#calcOut{margin-top:14px}
.qprice{font-size:20px!important}
.qprice.warn{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.qlog{margin:12px 0 4px;font-size:12px;color:var(--muted)}
.qlog summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.qlog div{padding:3px 0;border-bottom:1px solid var(--line)}
a.btn{text-decoration:none}
.steps{display:flex;gap:8px;margin:-6px 0 16px}
.steps span{font:400 12px 'DM Mono',monospace;color:var(--muted);padding:4px 10px;border-radius:6px;border:1px solid var(--line2)}

</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script type="text/plain" id="kriya-main">
const BOOT = window.__BOOT;
const S = {
  code: ls('kriya_code'), me: ls('kriya_me'), data: null, tab: ls('kriya_tab') || 'today',
  todayView: 'mine', bookView: 'schedule', day: null, reqFilter: 'New', taskScope: 'mine', taskFilter: 'all',
  clientQ: '', outreach: false, month: null, form: null, blocking: null, pending: 0, mutSeq: 0, saving: {}, lastRefresh: 0, newReqSeen: null
};
const A = {}; // click actions

/* ---------- utils ---------- */
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rp(n) { return 'Rp' + Math.round(+n || 0).toLocaleString('id-ID'); }
function pd(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function nice(s, opt) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || '—'; return pd(s).toLocaleDateString('en-GB', opt || { weekday: 'short', day: 'numeric', month: 'short' }); }
function daysSince(s) { if (!/^\d{4}-\d{2}-\d{2}/.test(s || '')) return null; return Math.round((pd(today()) - pd(s)) / 864e5); }
function today() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function mins(t) { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function statusKind(s) { s = String(s || ''); if (/cancel/i.test(s)) return 'cancelled'; if (/no.?show/i.test(s)) return 'noshow'; if (/complet|done|finish/i.test(s)) return 'done'; return 'active'; }
function payKind(s) { s = String(s || ''); if (/refund/i.test(s)) return 'refunded'; if (/unpaid|pending|due|not/i.test(s)) return 'unpaid'; if (/deposit|partial|dp/i.test(s)) return 'deposit'; if (/paid|full|settled|lunas/i.test(s)) return 'paid'; return 'unpaid'; }
function phoneLink(p) { let d = String(p || '').replace(/\D/g, ''); if (!d) return ''; if (d[0] === '0') d = '62' + d.slice(1); return d; }
function handleOf(h) { return String(h || '').trim().replace(/^@+/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/.*$/, ''); }
function first(n) { return String(n || '').trim().split(/\s+/)[0]; }
const RUN_TIMEOUT = 30000, READS = /^api_(bootstrap|login|images)$/;
function run(fn, ...args) {
  if (!READS.test(fn)) S.mutSeq++;   // a save: any refresh already in flight is now out of date
  return new Promise((ok, bad) => {
    let settled = false;
    const timer = setTimeout(() => { if (settled) return; settled = true; const e = new Error('The studio sheet is taking too long to answer. Check your connection.'); e.timeout = true; bad(e); }, RUN_TIMEOUT);
    google.script.run.withSuccessHandler(r => { if (settled) return; settled = true; clearTimeout(timer); ok(r); }).withFailureHandler(e => {
      if (settled) return; settled = true; clearTimeout(timer);
      const msg = (e && e.message) || String(e);
      if (/AUTH:/.test(msg) && S.code) { ls('kriya_code', null); ls('kriya_data', null); S.code = ''; S.data = null; }
      bad(new Error(msg.replace(/^.*?AUTH:\s*/, '').replace(/^Exception:\s*/, '')));
    })[fn](...args);
  });
}
/** True when the task sheet for this id is the one on screen. */
function sheetIs(id) { const el = document.querySelector('#layer .sheet'); return !!el && el.getAttribute('aria-label') === String(id); }
function toast(msg, err) {
  if (err) SFX.error();
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4200 : 2400);
}

/* ---------- sound: tiny synthesized cues, no files ---------- */
const SFX = (() => {
  let ctx = null;
  const on = () => ls('kriya_sound') !== 'off';
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, t0, dur, type, vol, f2) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  // a short low buzz, like a tattoo machine starting
  function machine(t0, dur, vol) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + t0;
    const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(92, t);
    lfo.frequency.setValueAtTime(46, t); lg.gain.setValueAtTime(vol * 0.6, t);
    f.type = 'lowpass'; f.frequency.setValueAtTime(700, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lfo.connect(lg); lg.connect(g.gain); o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
  }
  const play = fn => () => { if (on()) try { fn(); } catch (e) { } };
  return {
    on: on, unlock: () => { if (on()) ac(); },
    tap: play(() => tone(1400, 0, 0.03, 'sine', 0.025)),
    tick: play(() => { tone(880, 0, 0.07, 'triangle', 0.07, 1320); tone(2640, 0.01, 0.05, 'sine', 0.015); }),
    untick: play(() => tone(660, 0, 0.08, 'triangle', 0.05, 440)),
    allDone: play(() => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.075, 0.22, 'triangle', 0.07))),
    save: play(() => { machine(0, 0.32, 0.05); tone(1175, 0.34, 0.25, 'sine', 0.06); }),
    status: play(() => { tone(587, 0, 0.09, 'triangle', 0.06); tone(880, 0.08, 0.14, 'triangle', 0.06); }),
    ping: play(() => { tone(1318, 0, 0.5, 'sine', 0.06); tone(1760, 0.09, 0.45, 'sine', 0.04); }),
    error: play(() => { tone(220, 0, 0.09, 'square', 0.025); tone(174, 0.11, 0.14, 'square', 0.025); })
  };
})();

/* ---------- theme ---------- */
function themeNow() { return ls('kriya_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
function applyTheme() { document.documentElement.setAttribute('data-theme', themeNow()); }
A.theme = () => { ls('kriya_theme', themeNow() === 'dark' ? 'light' : 'dark'); applyTheme(); SFX.tap(); render(); };
A.sound = () => { ls('kriya_sound', SFX.on() ? 'off' : 'on'); SFX.tick(); render(); toast(SFX.on() ? 'Sounds on' : 'Sounds off'); };
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!ls('kriya_theme')) { applyTheme(); } }); } catch (e) { }
applyTheme();

const I = (d, w) => '<svg width="' + (w || 22) + '" height="' + (w || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICON = {
  today: I('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 10"/>'),
  cal: I('<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>'),
  tasks: I('<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.3 1.3L7.3 4.8M3.5 12l1.3 1.3 2.5-2.5M3.5 18l1.3 1.3 2.5-2.5"/>'),
  people: I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c1.8.7 3 2.4 3.5 5.2"/>'),
  coin: I('<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>'),
  quote: I('<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M8.5 11h1M12 11h1M15.5 11h0M8.5 14.5h1M12 14.5h1M8.5 18h1M12 18h1M15.5 14.5V18"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>', 20),
  close: I('<path d="M6 6l12 12M18 6L6 18"/>', 20),
  back: I('<path d="M15 5l-7 7 7 7"/>', 20),
  sun: I('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 20),
  moon: I('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', 20),
  soundOn: I('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>', 20),
  soundOff: I('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>', 20),
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wa: I('<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/>', 18),
  ig: I('<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/>', 18),
  mail: I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', 18),
  cam: I('<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', 18),
  sheet: I('<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16M4 14.5h16M10 9v11.5"/>', 18)
};
function word(small) { return '<div class="word">KRIYĀ' + (small ? '<small>studio</small>' : '') + '</div>'; }

/* ---------- data ---------- */
function newRequests() { return ((S.data && S.data.requests) || []).filter(r => (r.status || 'New') === 'New').length; }
function attention() { return newRequests() + (S.data && S.data.quotes ? S.data.quotes.filter(q => (q.status === 'Offer received' || q.status === 'Accepted') && !q.expired && !q.bookingId).length : 0); }
function setData(d) {
  const before = S.data ? attention() : null;
  S.data = d;
  try { ls('kriya_data', JSON.stringify(d)); } catch (e) { }
  if (!S.day) S.day = d.today; if (!S.month) S.month = d.today.slice(0, 7);
  S.lastRefresh = Date.now();
  const after = attention();
  if (before !== null && after > before) { SFX.ping(); toast(after - before === 1 ? 'New request or client reply' : (after - before) + ' new requests or client replies'); }
}
function saveCache() { try { ls('kriya_data', JSON.stringify(S.data)); } catch (e) { } }
function bookings() { return (S.data && S.data.bookings) || []; }
function team() { return (S.data && S.data.team) || []; }
function meRec() { return team().find(t => t.name === S.me) || null; }
function clientById(id) { return (S.data.clients || []).find(c => c.id === id); }
function clientFor(b) { return clientById(b.clientId) || (S.data.clients || []).find(c => c.name.toLowerCase() === String(b.client).toLowerCase()); }
function byStart(a, b) { return (a.date + (a.start || '99')).localeCompare(b.date + (b.start || '99')); }
async function refresh(quiet) {
  if (S.pending) { if (!quiet) toast('Saving first…'); return; }
  const seq = S.mutSeq;
  try {
    const d = await run('api_bootstrap', S.code);
    if (seq !== S.mutSeq || S.pending) return;   // a save happened meanwhile; its own answer is newer
    setData(d); render(); if (!quiet) toast('Up to date');
  }
  catch (e) { if (!S.code) render(); else if (!quiet) toast(e.message, true); }
}
A.refresh = () => { SFX.tap(); refresh(); };

/* ---------- lock ---------- */
function renderLock(step) {
  const app = document.getElementById('app');
  if (step === 'who') {
    const people = team().length ? team() : (S.data.reps || []).map(n => ({ name: n, role: '' }));
    app.innerHTML = '<div class="lockbg"><div class="lock">' + word(true) + '<h1>Who’s working?</h1><p class="whisper">pick your name. this phone remembers it.</p>' +
      '<div class="who-list">' + people.map(p => '<button class="btn wide who-btn" data-a="pickWho" data-n="' + esc(p.name) + '"><span>' + esc(p.name) + '</span><span class="mono">' + esc((p.role || '').toLowerCase()) + '</span></button>').join('') + '</div>' +
      '<p class="whisper" style="margin-top:18px">not listed? ask nathasjja to add you to the App Team tab.</p></div></div>';
    return;
  }
  app.innerHTML = '<div class="lockbg"><div class="lock">' + word(true) + '<h1>Open the studio.</h1><p class="whisper">studio code only. this phone remembers it.</p>' +
    '<form id="codeForm"><div class="field"><label class="label" for="codeIn">studio code</label>' +
    '<input id="codeIn" class="input codebox" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>' +
    '<button class="btn primary wide" id="codeBtn">Open the studio</button></form>' +
    '<p class="whisper" style="margin-top:18px">no code? ask nathasjja.</p></div></div>';
  document.getElementById('codeForm').onsubmit = async e => {
    e.preventDefault(); SFX.unlock();
    const btn = document.getElementById('codeBtn'), code = document.getElementById('codeIn').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const d = await run('api_login', code);
      S.code = code; ls('kriya_code', code); setData(d); SFX.status();
      S.me && meRec() ? render() : renderLock('who');
    } catch (err) { toast(err.message, true); btn.disabled = false; btn.textContent = 'Open the studio'; }
  };
  setTimeout(() => document.getElementById('codeIn').focus(), 50);
}
A.pickWho = d => { S.me = d.n; ls('kriya_me', d.n); S.tab = 'today'; SFX.allDone(); render(); };
A.switchMe = () => { ls('kriya_me', null); S.me = ''; renderLock('who'); };

/* ---------- shell ---------- */
function myOpenDue() {
  return (S.data.tasks || []).filter(t => t.owner === S.me && taskKind(t.status) !== 'done' && t.due && daysSince(t.due) >= 0).length;
}
function render() {
  if (!S.code || !S.data) return renderLock();
  if (!S.me || (team().length && !meRec())) return renderLock('who');
  const tabs = [['today', 'today', ICON.today], ['bookings', 'bookings', ICON.cal], ['quote', 'quote', ICON.quote], ['tasks', 'tasks', ICON.tasks], ['clients', 'clients', ICON.people], ['money', 'money', ICON.coin]];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'today';
  const badge = { bookings: attention() - walkAttention(), quote: walkAttention(), tasks: myOpenDue() };
  const body = { today: viewToday, bookings: viewBookings, quote: viewQuote, tasks: viewTasks, clients: viewClients, money: viewMoney }[S.tab]();
  const fab = S.tab === 'bookings' || S.tab === 'clients' ? '<button class="fab" data-a="newBooking">' + ICON.plus + 'Book</button>'
    : S.tab === 'tasks' ? '<button class="fab" data-a="newTask">' + ICON.plus + 'Task</button>' : '';
  document.getElementById('app').innerHTML =
    '<header class="top"><div class="wrap"><button class="wordbtn" data-a="refresh" aria-label="KRIYĀ studio, refresh">' + word(true) + '</button>' +
    '<div class="me">' +
    '<button class="iconbtn" data-a="sound" aria-label="' + (SFX.on() ? 'Turn sounds off' : 'Turn sounds on') + '">' + (SFX.on() ? ICON.soundOn : ICON.soundOff) + '</button>' +
    '<button class="iconbtn" data-a="theme" aria-label="' + (themeNow() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode') + '">' + (themeNow() === 'dark' ? ICON.sun : ICON.moon) + '</button>' +
    '<button class="who" data-a="switchMe" aria-label="Signed in as ' + esc(S.me) + ', switch person">' + esc(first(S.me).toLowerCase()) + '</button>' +
    '</div></div></header>' +
    '<main><div class="wrap">' + body + '</div></main>' + fab +
    '<nav class="tabs" aria-label="Sections"><div class="wrap">' + tabs.map(([k, l, i]) =>
      '<button data-a="tab" data-k="' + k + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + i + l +
      (badge[k] ? '<span class="badge">' + badge[k] + '</span>' : '') + '</button>').join('') + '</div></nav>';
  afterRender();
}
A.tab = d => { if (S.tab !== d.k) SFX.tap(); S.tab = d.k; ls('kriya_tab', d.k); render(); window.scrollTo(0, 0); };
function seg(action, current, options, label) {
  return '<div class="segbar" role="group" aria-label="' + esc(label) + '" style="grid-template-columns:repeat(' + options.length + ',minmax(0,1fr))">' + options.map(([k, l]) =>
    '<button data-a="' + action + '" data-k="' + k + '" aria-pressed="' + (current === k) + '">' + l + '</button>').join('') + '</div>';
}

/* ---------- today: daily checklist ---------- */
function cl() { return (S.data && S.data.checklist) || { items: [], done: {}, workday: true }; }
function itemsFor(p) { return cl().items.filter(i => i.person === p); }
function doneRec(p, id) { return cl().done[p + '|' + id]; }
function sections(items) { const out = []; items.forEach(i => { let s = out.find(x => x.name === i.section); if (!s) out.push(s = { name: i.section, items: [] }); s.items.push(i); }); return out; }
function viewToday() {
  const t = today();
  let h = '<div class="hello"><span class="label">' + esc(pd(t).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }).toLowerCase()) + '</span>' +
    '<h1>' + (S.todayView === 'team' ? 'Team.' : esc(first(S.me)) + '’s day.') + '</h1></div>';
  h += seg('todayView', S.todayView, [['mine', 'my checklist'], ['team', 'team']], 'View');
  return h + (S.todayView === 'team' ? viewTeam() : viewMine());
}
A.todayView = d => { SFX.tap(); S.todayView = d.k; render(); };
function viewMine() {
  const c = cl(), mine = itemsFor(S.me);
  let h = '';
  if (!c.workday) {
    h += '<div class="calm"><div class="label calm-hi">day off</div><p style="margin:6px 0 0">No checklist today. It comes back on workdays (' + esc(c.workdays.toLowerCase()) + ').</p></div>';
  } else if (!mine.length) {
    h += '<div class="empty">no checklist items for you yet.<br>' + (S.data.links ? '<a href="' + esc(S.data.links.checklist) + '" target="_blank" rel="noopener">add them in the daily checklist tab</a>' : '') + '</div>';
  } else {
    const done = mine.filter(i => doneRec(S.me, i.id)).length, next = mine.find(i => !doneRec(S.me, i.id));
    h += '<section class="calm"><span class="label calm-hi">daily checklist</span>' +
      '<div class="bignum"><span class="calm-hi">' + done + '</span><span class="calm-mut"> of ' + mine.length + ' done</span></div>' +
      '<div class="bar calm-bar" role="img" aria-label="' + Math.round(done / mine.length * 100) + '% done"><i style="width:' + Math.round(done / mine.length * 100) + '%"></i></div>' +
      '<span class="label calm-mut">' + (next ? 'next · ' + esc(next.item.toLowerCase()) : 'all done for today') + '</span></section>';
    sections(mine).forEach(s => {
      const n = s.items.filter(i => doneRec(S.me, i.id)).length;
      h += '<div class="sechead"><h3>' + esc(s.name) + '</h3><span class="label">' + n + '/' + s.items.length + '</span></div>';
      h += s.items.map(i => {
        const r = doneRec(S.me, i.id);
        return '<button class="check' + (r ? ' on' : '') + '" data-a="tick" data-id="' + esc(i.id) + '" aria-pressed="' + !!r + '">' +
          '<span class="box">' + (r ? ICON.check : '') + '</span><span class="ct"><span class="ci">' + esc(i.item) + '</span>' +
          '<span class="cm">' + (r ? 'done ' + esc(r.at || nowHM()) + (r.by && r.by !== S.me ? ' · ' + esc(first(r.by).toLowerCase()) : '') : esc(i.note)) + '</span></span></button>';
      }).join('');
    });
  }
  // my tasks due today or overdue, then urgent
  const tasks = (S.data.tasks || []).filter(t => t.owner === S.me && taskKind(t.status) !== 'done')
    .sort((a, b) => taskRank(a) - taskRank(b)).slice(0, 4);
  h += '<div class="sechead"><h3>My tasks</h3><button class="linkbtn" data-a="tab" data-k="tasks">all →</button></div>';

function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => bad(new Error('Could not read that image'));
    img.src = url;
  });
}

/* ---------- quotes: calculator + client offers ---------- */
function PR() { return (S.data && S.data.pricing) || { rate: 1000000, cph: 9, mults: [1, 1.5, 2, 2.5], names: ['Minimal line', 'Detailed line', 'Shading', 'Solid / red fill'], tricky: 0.25, range: 0.15, maxSession: 5, deposit: 500000, validDays: 7 }; }
function quotes() { return (S.data && S.data.quotes) || []; }
function quoteById(id) { return quotes().find(q => q.id === id); }
function quoteFor(reqId) { return quotes().filter(q => q.requestId === reqId).sort((a, b) => String(b.created).localeCompare(String(a.created)))[0]; }
function reqById(id) { return (S.data.requests || []).find(x => x.id === id); }
function offersWaiting() { return quotes().filter(q => q.status === 'Offer received' && !q.expired).length; }
function halfUp(x) { return Math.max(0.5, Math.ceil(x * 2 - 1e-9) / 2); }
function hrsTxt(h) { return h < 1 ? Math.round(h * 60) + ' min' : (h % 1 ? h.toFixed(1) : h.toFixed(0)) + ' h'; }
function digits(v) { return Number(String(v || '').replace(/\D/g, '')) || 0; }
function dots(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function calc(c) {
  const p = PR(), m = p.mults[c.detail] || 1, pf = c.tricky ? 1 + p.tricky : 1;
  const raw = c.len * c.pieces / p.cph * m * pf;
  const low = halfUp(raw * (1 - p.range)), mid = halfUp(raw), high = halfUp(raw * (1 + p.range));
  const pLow = Math.max(p.rate, low * p.rate), pMid = Math.max(p.rate, mid * p.rate), pHigh = Math.max(p.rate, high * p.rate);
  return { raw: raw, low: low, mid: mid, high: high, pLow: pLow, pMid: pMid, pHigh: pHigh, sessions: Math.ceil(high / p.maxSession),
    suggested: Math.round(pMid / 50000) * 50000, floor: Math.max(p.rate, Math.round(pLow / 50000) * 50000) };
}
function reqToCalc(r) {

    '<div class="stepper" style="width:150px"><button type="button" data-a="qPieces" data-v="-1" aria-label="Fewer pieces">−</button><span id="qPieces"></span><button type="button" data-a="qPieces" data-v="1" aria-label="More pieces">+</button></div></div>' +
    '<div class="label">detail</div><div class="detailgrid" role="group" aria-label="Detail">' + p.names.map((n, i) =>
      '<button data-a="qDetail" data-i="' + i + '" aria-pressed="' + (c.detail === i) + '"><span>' + esc(n) + '</span><span class="mono">×' + p.mults[i] + '</span></button>').join('') + '</div>' +
    '<div class="label" style="margin-top:12px">placement</div><div id="qPlaceBox">' + placeSeg() + '</div>' +
    '<section class="calm" id="calcOut" aria-live="polite"></section>' +
    '<div class="field" style="margin-top:14px"><label class="label" for="qPrice">your quote (rp)</label><input id="qPrice" class="input mono qprice" inputmode="numeric">' +
    '<span class="label" id="qNote" style="display:block;margin-top:6px"></span></div>';
}
function wireCalc() {
  const len = document.getElementById('qLen'), qp = document.getElementById('qPrice');
  if (!len || !qp) return;
  len.oninput = e => { S.calc.len = Number(e.target.value); drawCalc(true); };
  qp.oninput = e => { S.calc.quote = digits(e.target.value); drawQuoteNote(); };
  qp.onblur = e => { e.target.value = dots(S.calc.quote); };
  drawCalc(S.calc.quote == null);
  qp.value = dots(S.calc.quote);
}
function afterRender() {
  if (S.tab === 'quote' && walk().step === 1 && !document.getElementById('layer').innerHTML) wireCalc();
  if (S.tab === 'quote' && walk().step === 2) drawWalkSugg();
}
A.walkNext = () => {
  const c = walk().calc, p = PR();
  if (c.quote < p.rate) return toast('Below the ' + rp(p.rate) + ' session minimum', true);
  if (c.quote < calc(c).floor && !isOwnerMe()) return toast('Below the low end. Only the owner can quote this.', true);
  SFX.tap(); walk().step = 2; render(); window.scrollTo(0, 0);
  setTimeout(() => { const i = document.getElementById('wName'); if (i && !i.value) i.focus(); }, 60);
};
A.walkBack = () => { walk().step = 1; SFX.tap(); render(); window.scrollTo(0, 0); };
A.walkReset = () => { S.walk = null; A.closeSheet(); S.tab = 'quote'; render(); window.scrollTo(0, 0); };
function drawWalkSugg() {
  const box = document.getElementById('wSugg'), w = walk();
  if (!box) return;
  const q = String(w.name || '').trim().toLowerCase();
  const hits = q.length > 1 ? (S.data.clients || []).filter(c => (c.name + ' ' + c.handle + ' ' + c.phone).toLowerCase().includes(q)).slice(0, 4) : [];
  box.innerHTML = hits.length ? '<div class="suggest">' + hits.map(c => '<button type="button" data-a="walkPick" data-id="' + esc(c.id) + '"><b>' + esc(c.name) + '</b> <span class="muted">' + esc(c.handle || '') + '</span></button>').join('') +
    '<button type="button" data-a="walkNew">+ New client “' + esc(w.name.trim()) + '”</button></div>' : '';
}
A.walkPick = d => { const c = clientById(d.id), w = walk(); if (!c) return; Object.assign(w, { clientId: c.id, name: c.name, phone: w.phone || c.phone, handle: w.handle || c.handle }); SFX.tap(); render(); };
A.walkNew = () => { document.getElementById('wSugg').innerHTML = ''; const i = document.getElementById('wPhone'); if (i) i.focus(); };
A.walkUnpick = () => { const w = walk(); w.clientId = ''; w.name = ''; render(); setTimeout(() => { const i = document.getElementById('wName'); if (i) i.focus(); }, 40); };
function walkPayload(inPerson) {
  const w = walk(), c = w.calc, r = calc(c), p = PR();
  const chosen = w.clientId ? clientById(w.clientId) : null;
  return {
    id: '', requestId: '', client: (chosen ? chosen.name : String(w.name || '').trim()), phone: String(w.phone || '').trim(), handle: String(w.handle || '').trim(),
    piece: String(w.piece || '').trim(), len: c.len, pieces: c.pieces, detail: p.names[c.detail],
    placement: (String(w.place || '').trim() || (c.tricky ? 'tricky spot' : '')) + (c.tricky ? ' (tricky)' : ''),
    hours: r.mid, low: r.pLow, high: r.pHigh, quoted: c.quote, deposit: p.deposit, inPerson: !!inPerson
  };
}
function walkCheck(q, needContact) {
  if (!q.client) { toast('Add the client’s name', true); return false; }
  if (!q.piece) { toast('Describe the piece', true); return false; }
  if (needContact && !q.phone && !q.handle) { toast('Add WhatsApp or Instagram so you can send the link', true); return false; }
  return true;
}
A.walkBook = async () => {
  const w = walk(), q = walkPayload(true);
  if (!walkCheck(q, false)) return;
  if (w.quoteId && quoteById(w.quoteId)) return A.bookQuote({ id: w.quoteId });
  const btn = document.getElementById('wBook'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const res = await run('api_saveQuote', S.code, q, S.me);
    setData(res.data); SFX.status(); w.quoteId = res.id; render();
    const chosen = w.clientId ? clientById(w.clientId) : (S.data.clients || []).find(c => c.name.toLowerCase() === q.client.toLowerCase());
    openForm({ client: q.client, clientId: chosen ? chosen.id : '', phone: q.phone, handle: q.handle, date: today(),
      placement: [q.placement.replace(/\s*\(tricky\)$/, ''), q.piece].filter(Boolean).join(' · '), value: q.quoted, hours: q.hours,
      notes: 'Walk-in · quote ' + res.id + ' agreed in person at ' + rp(q.quoted) + (w.sens ? '\nSensitivities: ' + w.sens : ''),
      quoteId: res.id, sens: w.sens || '', source: 'Walk-in' });
    if (!chosen) { S.form.F.isNew = true; drawClient(); }
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Agreed · book now'; }
};
A.walkSend = async () => {
  const q = walkPayload(false);
  if (!walkCheck(q, true)) return;
  const btn = document.getElementById('wSend'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const res = await run('api_saveQuote', S.code, q, S.me);
    setData(res.data); SFX.save(); S.walk = null; render();
    showSend(res.id, res.link, { client: q.client, phone: q.phone, handle: q.handle, piece: q.piece, quote: q.quoted });
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Send quote link instead'; }
};
A.openQuote = d => { const q = quoteById(d.id); if (!q) return; sheet(q.client || q.id, '<p class="sub" style="margin:-4px 0 6px">' + esc(q.piece) + '</p>' + quoteActions(q, '')); };
document.addEventListener('input', e => {
  const k = e.target && e.target.dataset && e.target.dataset.w;
  if (!k || !S.walk) return;
  S.walk[k] = e.target.value;
  if (k === 'name') drawWalkSugg();
});

/* ---------- clients ---------- */
function viewClients() {
  const all = (S.data.clients || []).slice();
  let list = all;
  const q = S.clientQ.toLowerCase();
  if (q) list = list.filter(c => (c.name + ' ' + c.handle + ' ' + c.phone).toLowerCase().includes(q));
  if (S.outreach) list = list.filter(c => (daysSince(c.last) ?? 0) >= 30).sort((a, b) => (daysSince(b.last) || 0) - (daysSince(a.last) || 0));
  else list.sort((a, b) => String(b.last).localeCompare(String(a.last)));
  const queue = all.filter(c => (daysSince(c.last) ?? 0) >= 30).length;
  let h = '<h2>Clients</h2><div class="field"><label class="sr" for="cq">Search clients</label><input id="cq" class="input" placeholder="Search name, @handle or phone" value="' + esc(S.clientQ) + '"></div>' +
    '<div class="seg"><button data-a="outreach" data-v="0" aria-pressed="' + !S.outreach + '">All <span class="mono">' + all.length + '</span></button><button data-a="outreach" data-v="1" aria-pressed="' + S.outreach + '">Due a check-in <span class="mono">' + queue + '</span></button></div>';
  h += list.length ? list.map(c => { const ds = daysSince(c.last); return '<button class="card" data-a="openClient" data-id="' + esc(c.id) + '"><div class="row"><div><div class="title">' + esc(c.name) + '</div><div class="sub">' + esc(c.handle || c.phone || c.id) + '</div></div>' +
    '<div style="text-align:right"><div class="mono" style="font-size:14px">' + rp(c.ltv) + '</div><div class="pills" style="justify-content:flex-end"><span class="pill">' + (c.sessions || 0) + ' sess.</span>' + (ds != null ? '<span class="pill ' + (ds >= 30 ? 'warn' : '') + '">' + ds + 'd</span>' : '') + '</div></div></div></button>'; }).join('')
    : '<div class="empty">no clients match.</div>';
  setTimeout(() => { const i = document.getElementById('cq'); if (i) i.oninput = e => { S.clientQ = e.target.value; const p = e.target.selectionStart; render(); const n = document.getElementById('cq'); n.focus(); n.setSelectionRange(p, p); }; }, 0);
  return h;
}
A.outreach = d => { S.outreach = d.v === '1'; render(); };
A.openClient = d => {
  const c = clientById(d.id); if (!c) return;
  const hist = bookings().filter(b => b.clientId === c.id || b.client.toLowerCase() === c.name.toLowerCase()).sort(byStart).reverse();
  const ds = daysSince(c.last);
  let h = '<div class="stats"><div class="stat"><div class="label">Lifetime</div><div class="n">' + rp(c.ltv) + '</div></div><div class="stat"><div class="label">Sessions</div><div class="n">' + (c.sessions || 0) + '</div></div></div>' +
    '<dl class="kv"><dt>Last visit</dt><dd>' + (c.last ? nice(c.last, { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + ds + ' days ago' : '—') + '</dd><dt>Sales rep</dt><dd>' + esc(c.rep || '—') + '</dd>' +
    (c.stage ? '<dt>Cadence</dt><dd>' + esc(c.stage) + (c.window ? ' <span class="muted">· ' + esc(c.window) + '</span>' : '') + '</dd>' : '') +
    (c.channel ? '<dt>Channel</dt><dd>' + esc(c.channel) + '</dd>' : '') + '</dl>';
  h += '<div class="actions">' + contactButtons(c.phone, c.handle, '', c.script || '') + '<button class="btn" data-a="newBooking" data-client="' + esc(c.id) + '">New booking</button></div>';
  if (c.script) h += '<div class="note"><span class="label">outreach message · whatsapp opens with this</span>' + esc(c.script) + '</div>';
  h += '<div class="field"><label class="label" for="cSens">Sensitivities & placement</label><textarea id="cSens" class="input">' + esc(c.sens) + '</textarea></div>' +
    '<div class="grid2"><div class="field"><label class="label" for="cPhone">WhatsApp</label><input id="cPhone" class="input" inputmode="tel" value="' + esc(c.phone) + '"></div><div class="field"><label class="label" for="cHandle">Instagram</label><input id="cHandle" class="input" value="' + esc(c.handle) + '"></div></div>' +
    '<button class="btn wide" data-a="saveClient" data-id="' + esc(c.id) + '">Save client</button>';
  h += '<h3>Bookings</h3>' + (hist.length ? hist.map(bookingCard).join('') : '<p class="muted">None in the app yet. Older sessions are counted in the totals above.</p>');
  sheet(c.name, h);
};
A.saveClient = async d => {
  try { setData(await run('api_saveClient', S.code, d.id, { sens: document.getElementById('cSens').value, phone: document.getElementById('cPhone').value, handle: document.getElementById('cHandle').value })); render(); toast('Client saved'); }
  catch (e) { toast(e.message, true); }
};

/* ---------- money ---------- */
function viewMoney() {
  const m = S.month, st = S.data.settings;
  const inMonth = bookings().filter(b => String(b.date).slice(0, 7) === m);
  const live = inMonth.filter(b => statusKind(b.status) !== 'cancelled');
  const sum = (arr, k) => arr.reduce((s, b) => s + (+b[k] || 0), 0);
  const booked = sum(live, 'value'), done = sum(live.filter(b => statusKind(b.status) === 'done'), 'value');
  const pct = st.target ? Math.min(100, Math.round(booked / st.target * 100)) : 0;
  const reps = {}; live.forEach(b => { const k = b.rep || 'No rep'; reps[k] = reps[k] || { v: 0, c: 0, n: 0 }; reps[k].v += +b.value || 0; reps[k].c += +b.commission || 0; reps[k].n++; });
  const owed = live.filter(b => statusKind(b.status) === 'done' && payKind(b.payment) !== 'paid').sort(byStart);
  const cancelledVal = sum(inMonth.filter(b => statusKind(b.status) === 'cancelled'), 'value');
  const label = pd(m + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const myRep = (meRec() || {}).rep || '';
  let h = '<div class="row" style="align-items:center"><button class="iconbtn" data-a="month" data-v="-1" aria-label="Previous month">‹</button><h2 style="margin:0">' + label + '</h2><button class="iconbtn" data-a="month" data-v="1" aria-label="Next month">›</button></div><div style="height:14px"></div>';
  if (myRep) {
    const mine = live.filter(b => b.rep === myRep), mineDone = mine.filter(b => statusKind(b.status) === 'done');
    h += '<section class="calm mycomm"><span class="label calm-hi">your commission · ' + esc(first(S.me).toLowerCase()) + ' · ' + mine.length + ' session' + (mine.length === 1 ? '' : 's') + ' you booked</span>' +
      '<div class="bignum"><span class="calm-hi">' + rp(sum(mine, 'commission')) + '</span></div>' +
      '<span class="label calm-mut">' + rp(sum(mineDone, 'commission')) + ' from completed sessions · ' + rp(sum(mine, 'value')) + ' booked</span></section>';
  } else h += '<p class="whisper">add your sales rep name in the app team tab to see your own commission here.</p>';
  h += '<div class="stats"><div class="stat hot"><div class="label" style="color:var(--ink)">booked</div><div class="n">' + rp(booked) + '</div>' + (st.target ? '<div class="bar" role="img" aria-label="' + pct + '% of target"><i style="width:' + pct + '%"></i></div><div class="muted mono" style="font-size:12px;margin-top:6px">' + pct + '% of ' + rp(st.target) + '</div>' : '') + '</div>' +
    '<div class="stat"><div class="label">Completed</div><div class="n">' + rp(done) + '</div><div class="muted mono" style="font-size:12px;margin-top:6px">' + live.length + ' sessions</div></div></div>';
  h += '<h3>Commission by rep</h3>' + (Object.keys(reps).length ? '<table><thead><tr><th>Rep</th><th class="r">Revenue</th><th class="r">Comm.</th></tr></thead><tbody>' +
    Object.keys(reps).sort().map(k => '<tr' + (k === myRep ? ' class="me-row"' : '') + '><td>' + esc(k) + ' <span class="muted mono" style="font-size:12px">· ' + reps[k].n + '</span></td><td class="r">' + rp(reps[k].v) + '</td><td class="r">' + rp(reps[k].c) + '</td></tr>').join('') + '</tbody></table>' : '<p class="muted">No bookings this month.</p>');
  if (owed.length) h += '<h3>Not fully paid <span class="pill warn">' + owed.length + '</span></h3>' + owed.map(bookingCard).join('');
  if (cancelledVal) h += '<p class="muted" style="font-size:13px;margin-top:18px">Cancelled bookings (' + rp(cancelledVal) + ') are left out here. The sheet dashboard still counts them.</p>';
  return h;
}
A.month = d => { const [y, mo] = S.month.split('-').map(Number); const n = new Date(y, mo - 1 + Number(d.v), 1); S.month = ymd(n).slice(0, 7); render(); };

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (!fn) return;
  if (t.tagName === 'BUTTON' || t.classList.contains('scrim')) { if (t.dataset.a !== 'closeSheetBg') e.preventDefault(); }
  fn(t.dataset, t, e);
});
document.addEventListener('pointerdown', () => SFX.unlock(), { once: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('layer').innerHTML) A.closeSheet(); });
function busy() { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
setInterval(() => { if (document.visibilityState === 'visible' && S.code && S.data && !busy() && !S.pending) refresh(true); }, 90000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.code && S.data && Date.now() - S.lastRefresh > 30000 && !busy()) refresh(true); });
(function start() {
  if (S.code) {
    try { const cached = JSON.parse(ls('kriya_data') || 'null'); if (cached) { S.data = cached; S.day = cached.today; S.month = cached.today.slice(0, 7); } } catch (e) { }
    if (S.data) render();
    else document.getElementById('app').innerHTML = '<div class="lockbg"><div class="lock">' + word(true) + '<h1>Opening…</h1></div></div>';
    refresh(true);
  } else renderLock();
})();
</script>
<script>KRIYA.start('app');</script>
</body>
</html>
